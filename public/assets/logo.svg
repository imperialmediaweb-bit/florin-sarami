<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-label="Sarami Media">
  <defs>
    <linearGradient id="wingA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="wingB" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1e40af"/>
      <stop offset="0.6" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="bodyG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <!-- Hummingbird -->
  <g transform="translate(8,6)">
    <!-- upper wing -->
    <path fill="url(#wingA)" d="M96 78 C74 40 40 14 6 8 C34 2 78 10 104 34 C96 20 82 10 70 6 C96 8 118 26 126 52 Z"/>
    <!-- lower wing -->
    <path fill="url(#wingB)" d="M92 92 C60 96 24 118 10 148 C8 118 30 88 62 78 C40 78 22 86 10 98 C20 72 52 60 84 68 Z"/>
    <!-- body -->
    <path fill="url(#bodyG)" d="M88 70 C110 58 138 60 152 74 C162 84 162 96 152 102 C140 110 118 108 104 98 C96 92 90 82 88 70 Z"/>
    <!-- head + beak -->
    <path fill="#1e3a8a" d="M148 72 C158 66 170 66 178 72 L196 66 L182 80 C176 88 162 90 152 84 Z"/>
    <circle cx="163" cy="75" r="3" fill="#dbeafe"/>
    <!-- tail -->
    <path fill="url(#wingB)" d="M92 96 C76 112 62 138 60 164 C50 138 58 108 78 90 Z"/>
  </g>
  <!-- Wordmark -->
  <text x="222" y="118" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="58" font-weight="700" font-style="italic" fill="#1e3a8a">Sarami <tspan fill="#2563eb">Media</tspan></text>
</svg>
