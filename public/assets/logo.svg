<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 170" role="img" aria-label="Sarami Media">
  <defs>
    <linearGradient id="gSky" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="gMid" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="gDeep" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="gBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset=".55" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>

  <!-- Pasăre colibri -->
  <g transform="translate(6,2)">
    <!-- aripa din spate (mai închisă) -->
    <path fill="url(#gDeep)" d="M118 84
      C 96 46, 64 18, 26 6
      C 45 4, 68 10, 88 24
      C 104 35, 116 50, 123 66
      Z"/>
    <!-- aripa din față (mai deschisă, întinsă spre stânga) -->
    <path fill="url(#gMid)" d="M112 90
      C 82 58, 44 40, 4 42
      C 24 28, 52 24, 78 34
      C 96 41, 111 52, 120 66
      Z"/>
    <!-- pana de sus (accent luminos) -->
    <path fill="url(#gSky)" d="M121 70
      C 109 44, 89 22, 62 10
      C 84 12, 104 24, 117 42
      C 123 50, 127 58, 128 64
      Z"/>
    <!-- corp -->
    <path fill="url(#gBody)" d="M108 84
      C 130 66, 160 62, 178 74
      C 188 81, 189 94, 177 101
      C 156 112, 124 107, 109 95
      C 106 92, 106 87, 108 84
      Z"/>
    <!-- cap și cioc -->
    <path fill="#1e3a8a" d="M170 70
      C 180 62, 194 62, 202 68
      L 218 64
      L 203 78
      C 193 86, 178 86, 169 80
      Z"/>
    <circle cx="184" cy="72" r="3.4" fill="#eaf4ff"/>
    <!-- coadă (două pene) -->
    <path fill="url(#gDeep)" d="M110 98
      C 90 116, 76 142, 72 166
      C 65 138, 75 108, 96 90
      Z"/>
    <path fill="url(#gMid)" d="M119 102
      C 106 120, 99 142, 99 162
      C 91 138, 98 114, 112 99
      Z"/>
  </g>

  <!-- Wordmark -->
  <text x="246" y="106" font-family="'Segoe UI', 'Trebuchet MS', Verdana, sans-serif"
        font-size="54" font-weight="700" font-style="italic"
        letter-spacing="-1" fill="#1e3a8a">Sarami Media</text>
</svg>
