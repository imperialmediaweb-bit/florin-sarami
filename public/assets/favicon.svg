<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 215 190">
  <defs>
    <linearGradient id="p1" x1="0" y1="1" x2=".7" y2="0">
      <stop offset="0" stop-color="#8fd6fa"/><stop offset="1" stop-color="#e2f5fe"/>
    </linearGradient>
    <linearGradient id="p2" x1="0" y1="1" x2=".7" y2="0">
      <stop offset="0" stop-color="#4eb6f2"/><stop offset="1" stop-color="#a5e0fc"/>
    </linearGradient>
    <linearGradient id="p3" x1="0" y1="1" x2=".7" y2="0">
      <stop offset="0" stop-color="#2277e2"/><stop offset="1" stop-color="#6cc0f6"/>
    </linearGradient>
    <linearGradient id="pw" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e7de4"/><stop offset="1" stop-color="#0f3a9a"/>
    </linearGradient>
    <linearGradient id="pb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4694f2"/><stop offset=".5" stop-color="#1e4fd8"/><stop offset="1" stop-color="#0b2a80"/>
    </linearGradient>
    <linearGradient id="pt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#59dcea"/><stop offset="1" stop-color="#2794cc"/>
    </linearGradient>
  </defs>

  <!-- pene late, suprapuse (de la deschis la închis) -->
  <path fill="url(#p1)" d="M114 96 C 88 64, 70 32, 60 4 C 94 28, 114 62, 124 90 Z"/>
  <path fill="url(#p2)" d="M112 100 C 80 76, 52 48, 32 20 C 70 42, 98 72, 119 96 Z"/>
  <path fill="url(#p3)" d="M110 104 C 74 88, 38 70, 8 50 C 50 62, 88 84, 116 100 Z"/>

  <!-- aripa mare închisă, peste corp -->
  <path fill="url(#pw)" d="M126 114 C 98 100, 60 92, 26 94 C 60 106, 98 118, 128 122 C 130 119, 129 116, 126 114 Z"/>

  <!-- coadă: panglici late -->
  <path fill="url(#p3)" d="M114 118 C 96 136, 82 158, 76 178 C 68 148, 86 122, 110 110 Z"/>
  <path fill="url(#pt)" d="M124 122 C 112 140, 104 160, 102 176 C 94 150, 106 128, 121 116 Z"/>
  <path fill="url(#pw)" d="M132 124 C 126 138, 123 152, 124 164 C 116 148, 121 132, 130 120 Z"/>

  <!-- corp plinuț -->
  <path fill="url(#pb)" d="M110 100 C 116 82, 134 70, 152 72 C 166 74, 176 82, 179 92 C 182 104, 174 114, 158 119 C 138 125, 118 120, 111 110 C 108 106, 108 103, 110 100 Z"/>
  <!-- cap rotund -->
  <circle cx="172" cy="84" r="15" fill="url(#pb)"/>
  <!-- luciu pe spate/cap -->
  <path fill="#8fc2f9" opacity=".5" d="M120 92 C 132 78, 152 70, 168 74 C 152 72, 134 80, 124 94 Z"/>
  <!-- burtă turcoaz -->
  <path fill="url(#pt)" d="M116 112 C 130 121, 152 122, 166 113 C 156 127, 130 128, 116 118 Z"/>
  <!-- cioc -->
  <path fill="#123c8c" d="M185 79 C 194 74, 204 72, 213 73 C 206 80, 197 86, 187 88 C 185 85, 184 82, 185 79 Z"/>
  <!-- ochi -->
  <circle cx="172" cy="80" r="3.6" fill="#ffffff"/>
  <circle cx="173.2" cy="80.5" r="1.8" fill="#0b2a80"/>
</svg>
