<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 205 180">
  <defs>
    <linearGradient id="fSky" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#59c5f5"/>
      <stop offset="1" stop-color="#b8e9fd"/>
    </linearGradient>
    <linearGradient id="fMid" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2b6fe0"/>
      <stop offset="1" stop-color="#6fd0f7"/>
    </linearGradient>
    <linearGradient id="fBlue" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1740b8"/>
      <stop offset="1" stop-color="#3f8ef0"/>
    </linearGradient>
    <linearGradient id="fBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f8ef0"/>
      <stop offset=".6" stop-color="#1e4fd8"/>
      <stop offset="1" stop-color="#0c2a7c"/>
    </linearGradient>
    <linearGradient id="fTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fd6e8"/>
      <stop offset="1" stop-color="#2b9fd0"/>
    </linearGradient>
  </defs>

  <!-- pana de sus (cea mai deschisă) -->
  <path fill="url(#fSky)" d="M122 96
    C 94 60, 58 26, 30 8
    C 64 20, 98 50, 124 84
    Z"/>
  <!-- pana mijlocie -->
  <path fill="url(#fMid)" d="M119 102
    C 86 72, 46 46, 12 34
    C 50 42, 90 66, 122 92
    Z"/>
  <!-- pana de jos (cea mai închisă) -->
  <path fill="url(#fBlue)" d="M116 108
    C 82 86, 40 70, 5 66
    C 45 66, 90 82, 119 100
    Z"/>

  <!-- corp -->
  <path fill="url(#fBody)" d="M110 92
    C 128 74, 152 68, 168 78
    C 178 85, 177 98, 164 105
    C 145 115, 120 113, 108 103
    C 105 100, 106 95, 110 92
    Z"/>
  <!-- burtă turcoaz -->
  <path fill="url(#fTeal)" d="M116 106
    C 130 114, 150 114, 160 107
    C 152 118, 130 120, 117 112
    Z"/>
  <!-- cioc -->
  <path fill="#123c8c" d="M165 78
    C 173 74, 181 74, 187 77
    L 199 74
    L 189 85
    C 182 90, 172 90, 166 86
    Z"/>
  <circle cx="175" cy="81" r="2.8" fill="#eaf6ff"/>

  <!-- coadă (evantai spre stânga-jos) -->
  <path fill="url(#fBlue)" d="M106 110
    C 86 126, 68 148, 60 170
    C 58 142, 74 116, 98 103
    Z"/>
  <path fill="url(#fTeal)" d="M114 114
    C 100 130, 90 150, 88 168
    C 82 144, 93 122, 109 109
    Z"/>
  <path fill="url(#fMid)" d="M122 116
    C 114 130, 110 144, 110 156
    C 104 140, 110 124, 120 113
